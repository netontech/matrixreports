[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixreports"
version = "0.1.0"
description = "Attendance reports from a Matrix (COSEC) database with an unlimited number of in/out punches per day"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
web = ["Flask>=3.0"]
dev = ["pytest>=7.4", "Flask>=3.0"]

[project.scripts]
matrixreports = "matrixreports.cli:main"
matrixreports-web = "webapp.app:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["matrixreports*", "webapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
